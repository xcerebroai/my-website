name: Deploy First to Deal Challenge to GitHub Pages

# Publishes the self-contained First to Deal Challenge page as the Pages ROOT
# (index.html) on every push to main. SurplusFunds is a separate project and is
# NOT deployed here. The single-file build inlines all CSS/JS, so there are no
# base-path issues, and the opt-in form posts to your GoHighLevel webhook
# straight from the browser (no server needed).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build self-contained challenge page
        run: npm run build:matrix
      - name: Stage site (challenge page as the root index.html)
        run: |
          mkdir -p _site
          cp dist-challenge/challenge.html _site/index.html
          cp dist-challenge/challenge.html _site/challenge.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
